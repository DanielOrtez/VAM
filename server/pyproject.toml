requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2",
    "django-allauth[headless]>=65.20.1",
    "django-environ>=0.14.0",
    "psycopg[binary,pool]>=3.3.6",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=6.1.2",
    "mypy>=2.4.0",
    "ruff>=0.17.2",
]
